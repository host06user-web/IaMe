<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Assistente - Multilaser Edition</title>
    <style>
        :root { --neon: #00d9ff; --bg: #05070a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }

        /* AVATAR ANIMADO */
        .avatar { width: 120px; height: 120px; position: relative; margin-bottom: 20px; }
        .face { width: 100%; height: 100%; background: #111; border: 2px solid var(--neon); border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 15px var(--neon); }
        .eyes { display: flex; gap: 30px; margin-bottom: 15px; }
        .eye { width: 12px; height: 12px; background: var(--neon); border-radius: 50%; transition: 0.2s; }
        .mouth { width: 35px; height: 6px; background: var(--neon); border-radius: 3px; transition: 0.3s; }

        /* ANIMAÇÕES */
        .listening .eye { height: 20px; animation: blink 1s infinite; }
        .speaking .mouth { height: 20px; border-radius: 50%; animation: talk 0.2s infinite; }
        @keyframes talk { 0%, 100% { height: 6px; } 50% { height: 20px; } }
        @keyframes blink { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.1); } }

        #status { font-size: 0.8rem; color: var(--neon); margin-bottom: 10px; opacity: 0.7; }
        #output { width: 85%; text-align: center; color: #aaa; min-height: 50px; }
        .btn { margin-top: 25px; padding: 15px 40px; border: none; background: var(--neon); color: black; border-radius: 50px; font-weight: bold; font-size: 1rem; box-shadow: 0 5px 15px rgba(0,217,255,0.4); }
    </style>
</head>
<body>

    <div id="status">SISTEMA PRONTO</div>

    <div id="avatarBox" class="avatar">
        <div class="face">
            <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
            <div id="mouth" class="mouth"></div>
        </div>
    </div>

    <div id="output">Toque no botão e faça uma pergunta sobre o mapa</div>
    <button class="btn" id="startBtn">FALAR COM IA</button>

    <script>
        // CONFIGURAÇÕES - COLE SUA CHAVE AQUI
        const GROQ_API_KEY = "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"; 
        
        const avatar = document.getElementById('avatarBox');
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');

        // Reconhecimento de Voz
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';

        startBtn.onclick = () => {
            recognition.start();
            setExpression('listening');
            status.innerText = "OUVINDO...";
        };

        recognition.onresult = async (event) => {
            const userText = event.results[0][0].transcript;
            output.innerText = `"${userText}"`;
            setExpression('');
            status.innerText = "PENSANDO...";

            // Chamada para a Groq (IA Online Rápida)
            try {
                const response = await fetch("https://groq.com", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: [
                            {role: "system", content: "Você é uma assistente de inteligência militar sarcástica e eficiente. Responda em português de forma curta."},
                            {role: "user", content: userText}
                        ]
                    })
                });
                
                const data = await response.json();
                const aiResponse = data.choices[0].message.content;
                speak(aiResponse);
            } catch (err) {
                speak("Erro ao conectar com a rede. Verifique a chave da API.");
            }
        };

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.1;
            
            utterance.onstart = () => setExpression('speaking');
            utterance.onend = () => {
                setExpression('');
                status.innerText = "SISTEMA PRONTO";
            };

            window.speechSynthesis.speak(utterance);
            output.innerText = text;
        }

        function setExpression(state) {
            avatar.className = 'avatar ' + state;
        }
    </script>
</body>
</html>
