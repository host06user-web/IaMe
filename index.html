<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>IA Assistente</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: #fff;
    text-align: center;
}

.avatar {
    width: 100px;
    height: 100px;
    background: #444;
    border-radius: 50%;
    margin: 20px auto;
}

.speaking { background: green; }
.listening { background: blue; }
.thinking { background: orange; }

#output {
    margin: 20px;
    font-size: 18px;
}

input {
    width: 70%;
    padding: 10px;
    font-size: 16px;
}

button {
    padding: 10px;
    margin: 5px;
}
</style>
</head>

<body>

<div id="avatarBox" class="avatar"></div>
<div id="output">Digite ou fale algo</div>

<input id="inputText" placeholder="Digite sua pergunta..." />
<br>
<button id="sendBtn">Enviar</button>
<button id="startBtn">🎤 Falar</button>

<script>
const avatar = document.getElementById('avatarBox');
const output = document.getElementById('output');
const startBtn = document.getElementById('startBtn');
const sendBtn = document.getElementById('sendBtn');
const inputText = document.getElementById('inputText');

// ========================
// VOZ (seguro)
// ========================
let recognition;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'pt-BR';

    recognition.onresult = (event) => {
        const texto = event.results[0][0].transcript;
        responder(texto);
    };

    recognition.onerror = () => {
        output.innerText = "Erro na voz.";
        avatar.className = 'avatar';
    };
}

// ========================
// BASE IA
// ========================
let bancoDados = {};
let memoria = {};
let respostasFixas = {};

// ========================
// CARREGAR TXT
// ========================
async function carregarTXT(nome) {
    try {
        const r = await fetch(nome + "?t=" + Date.now());
        return r.ok ? await r.text() : "";
    } catch {
        return "";
    }
}

// ========================
function processarLinhas(texto, destino) {
    texto.split('\n').forEach(l => {
        if (!l.includes(':')) return;

        let [k, v] = l.split(':');
        let key = k.trim().toLowerCase();
        let value = v.replace(/#\d+/g, '').trim();

        if (!destino[key]) destino[key] = [];
        destino[key].push(value);

        if (!memoria[key]) memoria[key] = [];
    });
}

// ========================
async function iniciarSistema() {
    const dados = await carregarTXT('dados.txt');
    const respostas = await carregarTXT('respostas.txt');

    processarLinhas(dados, bancoDados);
    processarLinhas(respostas, respostasFixas);
}

// ========================
function detectarTema(p) {
    p = p.toLowerCase();

    if (p.includes("clima")) return "clima";
    if (p.match(/sobral|cidade|ceará/)) return "sobral";
    if (p.match(/militar|guerra/)) return "militar";
    return "global";
}

// ========================
function introducao() {
    const f = ["Olha,", "Então,", "Bom,", "Seguinte,"];
    return f[Math.floor(Math.random() * f.length)];
}

// ========================
function pegarRespostaTema(tema) {
    const lista = bancoDados[tema] || [];

    if (!lista.length) return "Ainda não sei sobre isso.";

    const r = lista[Math.floor(Math.random() * lista.length)];
    return r;
}

// ========================
function respostaNatural(chave) {
    const lista = respostasFixas[chave];
    if (!lista) return null;
    return lista[Math.floor(Math.random() * lista.length)];
}

// ========================
async function getClima() {
    try {
        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=-3.68&longitude=-40.35&current_weather=true");
        const data = await res.json();

        return `Está fazendo ${data.current_weather.temperature} graus.`;
    } catch {
        return "Não consegui ver o clima.";
    }
}

// ========================
function falar(texto) {
    output.innerText = texto;

    const voz = new SpeechSynthesisUtterance(texto);
    voz.lang = 'pt-BR';

    avatar.className = 'avatar speaking';

    voz.onend = () => avatar.className = 'avatar';

    speechSynthesis.speak(voz);
}

// ========================
// IA CENTRAL
// ========================
async function responder(pergunta) {
    avatar.className = 'avatar thinking';

    pergunta = pergunta.toLowerCase();

    if (pergunta.includes("clima")) {
        const clima = await getClima();
        falar(introducao() + " " + clima);
        return;
    }

    for (let chave in respostasFixas) {
        if (pergunta.includes(chave)) {
            falar(introducao() + " " + respostaNatural(chave));
            return;
        }
    }

    const tema = detectarTema(pergunta);
    falar(introducao() + " " + pegarRespostaTema(tema));
}

// ========================
// BOTÕES
// ========================
sendBtn.onclick = () => {
    if (!inputText.value) return;
    responder(inputText.value);
    inputText.value = "";
};

startBtn.onclick = () => {
    if (!recognition) {
        output.innerText = "Voz não suportada nesse dispositivo.";
        return;
    }

    avatar.className = 'avatar listening';
    output.innerText = "Ouvindo...";
    recognition.start();
};

// iniciar
iniciarSistema();
</script>

</body>
</html>
