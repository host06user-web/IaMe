<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>World Monitor AI - Expressiva</title>
    <style>
        :root { --cor-ia: #00ff88; }
        body { 
            background: #050505; color: #fff; font-family: 'Courier New', monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; overflow: hidden;
        }

        /* Rosto Animado */
        .face { 
            width: 160px; height: 160px; background: #0a0a0a; border-radius: 50%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            border: 3px solid var(--cor-ia); margin-bottom: 20px; transition: 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }
        .eye { width: 12px; height: 12px; background: var(--cor-ia); border-radius: 50%; margin: 0 20px; transition: 0.2s; }
        .mouth { width: 40px; height: 4px; background: var(--cor-ia); border-radius: 5px; transition: 0.2s; }
        
        .speaking .mouth { height: 25px; border-radius: 50%; animation: talk 0.2s infinite alternate; }
        @keyframes talk { from { transform: scaleY(0.6); } to { transform: scaleY(1.2); } }

        /* Barra de Carregamento */
        #loader { width: 250px; height: 4px; background: #222; margin-top: 10px; display: block; }
        #bar { width: 0%; height: 100%; background: var(--cor-ia); transition: 0.3s; }

        #output { font-size: 0.9rem; text-align: center; width: 80%; height: 80px; color: var(--cor-ia); margin: 20px 0; }
        
        .input-box { display: flex; gap: 5px; }
        input { padding: 12px; background: #000; border: 1px solid var(--cor-ia); color: var(--cor-ia); outline: none; width: 280px; }
        button { padding: 10px 20px; background: var(--cor-ia); color: #000; border: none; font-weight: bold; cursor: pointer; }

        /* Cores de Alerta */
        .militar { --cor-ia: #ff4400; }
        .global { --cor-ia: #00ccff; }
    </style>
</head>
<body>

    <div id="face" class="face">
        <div style="display:flex; margin-bottom: 20px;"><div class="eye"></div><div class="eye"></div></div>
        <div class="mouth"></div>
    </div>

    <div id="loader"><div id="bar"></div></div>
    <div id="output">INICIALIZANDO PROTOCOLOS...</div>

    <div class="input-box">
        <input type="text" id="userInput" placeholder="CONSULTAR TERMINAL..." autocomplete="off">
        <button id="sendBtn">ENVIAR</button>
    </div>

<script>
    const output = document.getElementById('output');
    const bar = document.getElementById('bar');
    const face = document.getElementById('face');
    let bancoDados = {};

    // 1. CARREGAMENTO DOS DADOS (CORS FIX)
    async function carregarTudo() {
        // Usando o link RAW correto para evitar erros de leitura
        const urls = [
            'https://githubusercontent.com',
            'https://githubusercontent.com'
        ];

        try {
            for (let i = 0; i < urls.length; i++) {
                const r = await fetch(urls[i]);
                if (!r.ok) throw new Error();
                const texto = await r.text();
                
                texto.split('\n').forEach(linha => {
                    let sep = linha.includes('=') ? '=' : ':';
                    if (!linha.includes(sep)) return;

                    let [chave, valor] = linha.split(sep);
                    chave = chave.trim().toLowerCase();
                    valor = valor.replace(/#\d+/g, '').trim();

                    if (!bancoDados[chave]) bancoDados[chave] = [];
                    if (!bancoDados[chave].includes(valor)) bancoDados[chave].push(valor);
                });
                bar.style.width = ((i + 1) * 50) + "%";
            }
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                output.innerText = "CONEXÃO ESTABELECIDA COM WORLD MONITOR. AGUARDANDO.";
            }, 500);
        } catch (e) {
            output.innerText = "ERRO CRÍTICO: FALHA NA SINCRONIZAÇÃO COM GITHUB.";
            output.style.color = "red";
        }
    }

    // 2. SISTEMA DE RESPOSTA INTELIGENTE (Busca por similaridade)
    function processar(pergunta) {
        pergunta = pergunta.toLowerCase();
        let melhorChave = "";

        // Tenta achar qualquer palavra da pergunta que exista como chave no banco
        for (let chave in bancoDados) {
            if (pergunta.includes(chave) || chave.includes(pergunta)) {
                melhorChave = chave;
                break;
            }
        }

        // Se não achou nada específico, tenta categorias gerais
        if (!melhorChave) {
            if (pergunta.includes("guerra") || pergunta.includes("ataque")) melhorChave = "militar";
            else if (pergunta.includes("tempo") || pergunta.includes("calor")) melhorChave = "clima";
            else melhorChave = "global";
        }

        const opcoes = bancoDados[melhorChave] || bancoDados["global"];
        const resposta = opcoes[Math.floor(Math.random() * opcoes.length)];

        // Estética
        if(melhorChave === "militar") document.body.className = "militar";
        else if(melhorChave === "clima") document.body.className = "global";
        else document.body.className = "";

        falar(resposta);
    }

    function falar(texto) {
        output.innerText = texto.toUpperCase();
        const voz = new SpeechSynthesisUtterance(texto);
        voz.lang = 'pt-BR';
        voz.rate = 1.0;

        face.classList.add('speaking');
        voz.onend = () => face.classList.remove('speaking');
        window.speechSynthesis.speak(voz);
    }

    document.getElementById('sendBtn').onclick = () => {
        const val = document.getElementById('userInput').value;
        if (!val) return;
        processar(val);
        document.getElementById('userInput').value = "";
    };

    carregarTudo();
</script>
</body>
</html>
