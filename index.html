<script>
const avatar = document.getElementById('avatarBox');
const output = document.getElementById('output');
const startBtn = document.getElementById('startBtn');

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();
recognition.lang = 'pt-BR';

// ========================
// BASE DE DADOS DINÂMICA
// ========================
let bancoDados = {};
let memoria = {};
let respostasFixas = {};

// ========================
// CARREGAR TXT
// ========================
async function carregarTXT(nome) {
    try {
        const r = await fetch(nome + "?t=" + Date.now());
        return r.ok ? await r.text() : "";
    } catch {
        return "";
    }
}

// ========================
// PROCESSAR LINHAS ( : )
// ========================
function processarLinhas(texto, destino) {
    texto.split('\n').forEach(l => {
        if (!l.includes(':')) return;

        let [k, v] = l.split(':');
        if (!k || !v) return;

        let key = k.trim().toLowerCase();
        let value = v.replace(/#\d+/g, '').trim();

        if (!destino[key]) destino[key] = [];
        destino[key].push(value);

        if (!memoria[key]) memoria[key] = [];
    });
}

// ========================
// INICIAR SISTEMA
// ========================
async function iniciarSistema() {
    const dados = await carregarTXT('dados.txt');
    const respostas = await carregarTXT('respostas.txt');

    processarLinhas(dados, bancoDados);
    processarLinhas(respostas, respostasFixas);
}

// ========================
// DETECTAR TEMA (IA)
// ========================
function detectarTema(pergunta) {
    const p = pergunta.toLowerCase();

    if (p.includes("clima") || p.includes("tempo")) return "clima";

    if (p.match(/sobral|cidade|ceará|educação/)) return "sobral";

    if (p.match(/militar|guerra|exército|armas/)) return "militar";

    if (p.match(/notícia|noticias|mundo|global|economia/)) return "global";

    return "global";
}

// ========================
// INTRO HUMANO
// ========================
function introducao() {
    const frases = [
        "Olha,",
        "Então,",
        "Bom,",
        "Deixa eu te explicar,",
        "Seguinte,"
    ];

    return frases[Math.floor(Math.random() * frases.length)];
}

// ========================
// RESPOSTA INTELIGENTE
// ========================
function pegarRespostaTema(tema) {
    const lista = bancoDados[tema] || [];

    if (lista.length === 0) return "Ainda não tenho informações sobre isso.";

    if (!memoria[tema]) memoria[tema] = [];

    const naoUsadas = lista.filter(i => !memoria[tema].includes(i));

    if (naoUsadas.length === 0) {
        memoria[tema] = [];
        return pegarRespostaTema(tema);
    }

    let quantidade = Math.floor(Math.random() * 2) + 2;
    let resposta = [];

    for (let i = 0; i < quantidade; i++) {
        const r = naoUsadas[Math.floor(Math.random() * naoUsadas.length)];
        resposta.push(r);
        memoria[tema].push(r);
    }

    return resposta.join(". ") + ".";
}

// ========================
// RESPOSTA FIXA
// ========================
function respostaNatural(chave) {
    const lista = respostasFixas[chave];
    if (!lista) return null;

    return lista[Math.floor(Math.random() * lista.length)];
}

// ========================
// CLIMA REAL
// ========================
async function getClima() {
    try {
        const res = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=-3.68&longitude=-40.35&current_weather=true"
        );
        const data = await res.json();

        const temp = data.current_weather.temperature;
        const vento = data.current_weather.windspeed;

        return `Agora está fazendo ${temp} graus com ventos de ${vento} quilômetros por hora.`;

    } catch {
        return "Não consegui obter o clima agora.";
    }
}

// ========================
// FALAR
// ========================
function falar(texto) {
    const voz = new SpeechSynthesisUtterance(texto);
    voz.lang = 'pt-BR';

    voz.onstart = () => avatar.className = 'avatar speaking';
    voz.onend = () => {
        avatar.className = 'avatar';
        output.innerText = texto;
    };

    speechSynthesis.speak(voz);
}

// ========================
// BOTÃO
// ========================
startBtn.onclick = () => {
    avatar.className = 'avatar listening';
    output.innerText = "Ouvindo...";
    recognition.start();
};

// ========================
// RECONHECIMENTO (IA)
// ========================
recognition.onresult = async (event) => {
    const pergunta = event.results[0][0].transcript.toLowerCase();
    avatar.className = 'avatar thinking';

    // 🔹 CLIMA PRIORIDADE
    if (pergunta.includes("clima") || pergunta.includes("tempo")) {
        const clima = await getClima();
        falar(introducao() + " " + clima);
        return;
    }

    // 🔹 RESPOSTAS DIRETAS
    for (let chave in respostasFixas) {
        if (pergunta.includes(chave)) {
            const resp = respostaNatural(chave);
            if (resp) {
                falar(introducao() + " " + resp);
                return;
            }
        }
    }

    // 🔹 IA DETECTA TEMA
    const tema = detectarTema(pergunta);
    const resposta = pegarRespostaTema(tema);

    falar(introducao() + " " + resposta);
};

// INICIAR
iniciarSistema();
</script>
