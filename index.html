<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>IA - World Monitor Interface</title>
    <style>
        :root {
            --cor-base: #00ff88;
            --cor-trans: rgba(0, 255, 136, 0.1);
        }
        body { 
            background: #050505; color: #fff; font-family: 'Courier New', Courier, monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; 
        }
        
        /* Interface de Monitoramento */
        .scanline {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10; pointer-events: none; background-size: 100% 2px, 3px 100%;
        }

        .face { 
            width: 180px; height: 180px; background: #0a0a0a; border-radius: 50%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            border: 2px solid var(--cor-base); 
            margin-bottom: 30px; transition: 0.4s; position: relative;
            box-shadow: 0 0 25px var(--cor-trans);
        }

        /* Temas de Monitoramento */
        .status-militar { --cor-base: #ff5500; --cor-trans: rgba(255, 85, 0, 0.2); }
        .status-global { --cor-base: #00ccff; --cor-trans: rgba(0, 204, 255, 0.2); }
        .status-normal { --cor-base: #00ff88; --cor-trans: rgba(0, 255, 136, 0.2); }

        .eye { width: 15px; height: 15px; background: var(--cor-base); border-radius: 50%; box-shadow: 0 0 10px var(--cor-base); transition: 0.3s; margin: 0 20px; }
        .mouth { width: 50px; height: 4px; background: var(--cor-base); border-radius: 5px; box-shadow: 0 0 10px var(--cor-base); transition: 0.3s; }

        .speaking .mouth { height: 25px; border-radius: 50%; animation: talk 0.15s infinite alternate; }
        @keyframes talk { from { transform: scale(0.8); } to { transform: scale(1.1); } }

        #output { 
            font-size: 1rem; text-align: center; width: 80%; height: 90px; 
            color: var(--cor-base); text-transform: uppercase; letter-spacing: 1px;
        }

        .controls { display: flex; gap: 5px; z-index: 20; }
        input { 
            padding: 12px; border: 1px solid var(--cor-base); background: #000; 
            color: var(--cor-base); outline: none; width: 250px;
        }
        button { 
            padding: 10px 20px; border: none; background: var(--cor-base); 
            color: #000; font-weight: bold; cursor: pointer; 
        }
    </style>
</head>
<body class="status-normal">
    <div class="scanline"></div>

    <div id="face" class="face">
        <div style="display:flex; margin-bottom: 25px;">
            <div class="eye"></div><div class="eye"></div>
        </div>
        <div class="mouth"></div>
    </div>

    <div id="output">SISTEMA INICIALIZADO // AGUARDANDO COMANDO...</div>

    <div class="controls">
        <input type="text" id="userInput" placeholder="CONSULTAR WORLD MONITOR...">
        <button id="sendBtn">ENVIAR</button>
    </div>

<script>
    const face = document.getElementById('face');
    const output = document.getElementById('output');
    const userInput = document.getElementById('userInput');
    let bancoConhecimento = {};

    // Áudio de Radar (Beep Sintetizado)
    function playBeep(freq = 440) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
    }

    async function carregarDados() {
        try {
            const urls = [
                'https://githubusercontent.com',
                'https://githubusercontent.com'
            ];
            for (let url of urls) {
                const r = await fetch(url);
                const texto = await r.text();
                texto.split('\n').forEach(linha => {
                    let sep = linha.includes('=') ? '=' : ':';
                    if(!linha.includes(sep)) return;
                    let [chave, valor] = linha.split(sep);
                    valor = valor.replace(/#\d+/g, '').trim();
                    chave = chave.trim().toLowerCase();
                    if(!bancoConhecimento[chave]) bancoConhecimento[chave] = [];
                    bancoConhecimento[chave].push(valor);
                });
            }
        } catch(e) { output.innerText = "ERRO DE SINCRONIZAÇÃO DE DADOS"; }
    }

    function responder(pergunta) {
        pergunta = pergunta.toLowerCase();
        let categoria = "global";
        
        if (pergunta.includes("militar") || pergunta.includes("guerra")) categoria = "militar";
        else if (pergunta.includes("sobral")) categoria = "sobral";

        // Mudar estética conforme categoria
        document.body.className = categoria === "militar" ? "status-militar" : (categoria === "sobral" ? "status-normal" : "status-global");
        playBeep(categoria === "militar" ? 200 : 600);

        const opcoes = bancoConhecimento[categoria];
        const resposta = opcoes[Math.floor(Math.random() * opcoes.length)];
        
        const prefixo = categoria === "militar" ? "RELATÓRIO DE CAMPO: " : "INFORMAÇÃO GLOBAL: ";
        falar(prefixo + resposta);
    }

    function falar(texto) {
        output.innerText = "";
        let i = 0;
        // Efeito de digitação (Telex)
        const digito = setInterval(() => {
            output.innerText += texto[i];
            i++;
            if(i >= texto.length) clearInterval(digito);
        }, 300);

        const voz = new SpeechSynthesisUtterance(texto);
        voz.lang = 'pt-BR';
        face.classList.add('speaking');
        voz.onend = () => face.classList.remove('speaking');
        window.speechSynthesis.speak(voz);
    }

    document.getElementById('sendBtn').onclick = () => {
        if(!userInput.value) return;
        responder(userInput.value);
        userInput.value = "";
    };

    carregarDados();
</script>
</body>
</html>
