<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>IA Assistente - Terminal Expressivo</title>
    <style>
        :root { --cor-ia: #00ff88; }
        body { 
            background: #050505; color: #fff; font-family: 'Courier New', monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; overflow: hidden;
        }

        /* Scanline efeito monitor antigo */
        body::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; pointer-events: none; background-size: 100% 2px, 3px 100%;
        }

        /* Rosto Animado */
        .face { 
            width: 160px; height: 160px; background: #0a0a0a; border-radius: 50%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            border: 3px solid var(--cor-ia); margin-bottom: 20px; transition: 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); z-index: 3;
        }
        .eye { width: 12px; height: 12px; background: var(--cor-ia); border-radius: 50%; margin: 0 20px; transition: 0.2s; box-shadow: 0 0 10px var(--cor-ia); }
        .mouth { width: 40px; height: 4px; background: var(--cor-ia); border-radius: 5px; transition: 0.2s; box-shadow: 0 0 10px var(--cor-ia); }
        
        .speaking .mouth { height: 25px; border-radius: 50%; animation: talk 0.2s infinite alternate; }
        @keyframes talk { from { transform: scaleY(0.6); } to { transform: scaleY(1.2); } }

        #output { font-size: 1rem; text-align: center; width: 80%; height: 80px; color: var(--cor-ia); margin: 20px 0; z-index: 3; text-transform: uppercase; }
        
        .input-box { display: flex; gap: 10px; z-index: 3; }
        input { padding: 12px; background: #000; border: 1px solid var(--cor-ia); color: var(--cor-ia); outline: none; width: 280px; font-family: 'Courier New', monospace; }
        button { padding: 10px 20px; background: var(--cor-ia); color: #000; border: none; font-weight: bold; cursor: pointer; }
        
        .loading-bar { width: 200px; height: 2px; background: #222; margin-top: 10px; position: relative; }
        #fill { width: 0%; height: 100%; background: var(--cor-ia); transition: 0.5s; }
    </style>
</head>
<body>

    <div id="face" class="face">
        <div style="display:flex; margin-bottom: 20px;"><div class="eye"></div><div class="eye"></div></div>
        <div class="mouth"></div>
    </div>

    <div id="status-bar" class="loading-bar"><div id="fill"></div></div>
    <div id="output">INICIALIZANDO...</div>

    <div class="input-box">
        <input type="text" id="userInput" placeholder="DIGITE AQUI..." autocomplete="off">
        <button id="sendBtn">EXECUTAR</button>
    </div>

<script>
    const output = document.getElementById('output');
    const face = document.getElementById('face');
    const fill = document.getElementById('fill');
    let bancoDados = {};
    let ultimaResposta = "";

    // FUNÇÃO PARA CARREGAR OS ARQUIVOS SEM ERROS
    async function carregarArquivos() {
        const arquivos = ['respostas.txt', 'dados.txt'];
        
        for (let nome of arquivos) {
            try {
                // Adicionamos um timestamp para evitar que o navegador use uma versão antiga (cache)
                const r = await fetch(nome + '?t=' + Date.now());
                if (!r.ok) continue;
                
                const texto = await r.text();
                const linhas = texto.split('\n');

                linhas.forEach(linha => {
                    // Detecta se usa : ou =
                    let sep = linha.includes('=') ? '=' : ':';
                    if (!linha.includes(sep)) return;

                    let partes = linha.split(sep);
                    let chave = partes[0].trim().toLowerCase();
                    let valor = partes.slice(1).join(sep).replace(/#\d+/g, '').trim();

                    if (!bancoDados[chave]) bancoDados[chave] = [];
                    if (valor && !bancoDados[chave].includes(valor)) {
                        bancoDados[chave].push(valor);
                    }
                });
            } catch (e) {
                console.error("Erro ao carregar " + nome);
            }
        }
        
        fill.style.width = "100%";
        setTimeout(() => {
            document.getElementById('status-bar').style.display = 'none';
            output.innerText = "SISTEMA PRONTO. AGUARDANDO ENTRADA.";
        }, 800);
    }

    function processar(pergunta) {
        pergunta = pergunta.toLowerCase().trim();
        if (!pergunta) return;

        let chaveEncontrada = "global";

        // Busca se alguma palavra da pergunta bate com as chaves do banco
        for (let chave in bancoDados) {
            if (pergunta.includes(chave)) {
                chaveEncontrada = chave;
                break;
            }
        }

        const opcoes = bancoDados[chaveEncontrada] || bancoDados["global"];
        
        if (!opcoes || opcoes.length === 0) {
            falar("DADO NÃO ENCONTRADO NO BANCO LOCAL.");
            return;
        }

        // Evita repetir a mesma frase
        let resposta;
        do {
            resposta = opcoes[Math.floor(Math.random() * opcoes.length)];
        } while (resposta === ultimaResposta && opcoes.length > 1);

        ultimaResposta = resposta;
        falar(resposta);
    }

    function falar(texto) {
        output.innerText = texto;
        
        // Cancela falas anteriores para não encavalar
        window.speechSynthesis.cancel();

        const voz = new SpeechSynthesisUtterance(texto);
        voz.lang = 'pt-BR';
        voz.rate = 1.1;

        face.classList.add('speaking');
        voz.onend = () => face.classList.remove('speaking');
        window.speechSynthesis.speak(voz);
    }

    // Eventos de botão e teclado
    document.getElementById('sendBtn').onclick = () => {
        const input = document.getElementById('userInput');
        processar(input.value);
        input.value = "";
    };

    document.getElementById('userInput').onkeypress = (e) => {
        if (e.key === 'Enter') document.getElementById('sendBtn').click();
    };

    // Inicia o carregamento
    carregarArquivos();
</script>
</body>
</html>
